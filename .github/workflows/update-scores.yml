name: Update Live Scores

on:
  schedule:
    # Every 5 minutes during tournament hours (Feb 13-15, 8am-10pm ET = 1pm-3am UTC)
    - cron: '*/5 13-23 * * *'
    - cron: '*/5 0-3 * * *'
  workflow_dispatch: {}          # Allow manual trigger anytime

permissions:
  contents: write

jobs:
  update-scores:
    runs-on: ubuntu-latest

    steps:
      - name: Check if tournament date
        id: datecheck
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          # Tournament runs Feb 13-15, 2026 (include Feb 16 for UTC overlap)
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [[ "$TODAY" == "2026-02-13" || "$TODAY" == "2026-02-14" || "$TODAY" == "2026-02-15" || "$TODAY" == "2026-02-16" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not a tournament date ($TODAY). Skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.datecheck.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.datecheck.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest scores
        if: steps.datecheck.outputs.run == 'true'
        run: node scripts/fetch-scores.mjs
        env:
          NODE_NO_WARNINGS: '1'

      - name: Check for changes
        if: steps.datecheck.outputs.run == 'true'
        id: changes
        run: |
          git diff --quiet data.js data.json 2>/dev/null || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.datecheck.outputs.run == 'true' && steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js data.json
          git commit -m "Auto-update scores $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
